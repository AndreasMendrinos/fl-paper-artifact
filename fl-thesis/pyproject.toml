[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fl-thesis"
version = "1.0.1"
description = "Local federated learning pipeline for thesis experiments"
license = "Apache-2.0"
requires-python = ">=3.10"

dependencies = [
    "flwr[simulation]>=1.26.0",
    "flwr-datasets>=0.5.0",
    "torch==2.8.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["fl_thesis"]

[tool.hatch.build.targets.sdist]
only-include = ["fl_thesis", "pyproject.toml", "README.md"]


[tool.flwr.app]
publisher = "name"


[tool.flwr.app.components]
serverapp = "fl_thesis.server_app:app"
clientapp = "fl_thesis.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 3
num-clients = 2
fraction-evaluate = 1.0
fraction-train = 1.0
local-epochs = 2
learning-rate = 0.1
batch-size = 16
partition-strategy = "iid"
dirichlet-alpha = 0.5

