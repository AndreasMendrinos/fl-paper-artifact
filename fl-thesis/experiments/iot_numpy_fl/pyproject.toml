[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iot-numpy-fl"
version = "1.0.0"
description = "Lightweight federated learning experiment with IoT-LAB proxy client"
requires-python = ">=3.10"

dependencies = [
    "flwr>=1.26.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["iot_fl"]

[tool.flwr.app]
publisher = "name"

[tool.flwr.app.components]
serverapp = "iot_fl.server_app:app"
clientapp = "iot_fl.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 3
num-clients = 1
fraction-train = 1.0
fraction-evaluate = 1.0
learning-rate = 0.01
local-epochs = 5
